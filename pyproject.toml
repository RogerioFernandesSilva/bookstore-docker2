[project]
name = "bookstore"
version = "0.1.0"
description = "Criando bookstore app"
authors = [
    {name = "Rogério Fernandes",email = "rog.fernandes@yahoo.com.br"}
]
requires-python = ">=3.11"
dependencies = [
    "django (>=5.1,<6.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)"
]

[dependency-groups]
dev = [
    "factory-boy (>=3.3.3,<4.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
